<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music distribution platforms</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #1c2020; color: #edf1ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 36px); }
    p { color: #aebbb5; line-height: 1.5; }
    .file-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 18px 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 18px; }
    .control-group { flex: 1 1 420px; min-width: 0; margin: 0; padding: 12px; border: 1px solid #47564e; border-radius: 8px; }
    .control-group legend { padding: 0 6px; font-size: 14px; font-weight: 600; }
    .control-fields { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .control-fields label { flex: 1 1 170px; min-width: 0; }
    .control-fields input, .control-fields select { width: 100%; min-width: 0; }
    label { display: grid; gap: 6px; font-size: 13px; color: #b8c7bf; }
    input, select, button { font: inherit; color: #edf1ef; background: #282e2c; border: 1px solid #47564e; border-radius: 6px; padding: 9px 12px; }
    input[type="search"] { width: min(300px, 80vw); }
    input[type="file"] { max-width: 300px; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid #8de4b5; outline-offset: 2px; }
    .legend { display: flex; flex-wrap: wrap; gap: 22px; font-size: 14px; }
    .yes { color: #60ed88; }
    .never { color: #ff7278; }
    .no { color: #ff7278; }
    .maybe { color: #ffbf69; }
    .ended { color: #c7a0ff; }
    .paused { color: #ffda78; }
    .unknown { color: #b4bdb8; }
    #message { font-size: 14px; min-height: 22px; }
    .table-wrap { overflow: auto; max-height: 73vh; border: 1px solid #323d37; border-radius: 10px; background: #111715; scrollbar-color: #63736a #202823; }
    table { border-collapse: separate; border-spacing: 0; font-size: 13px; }
    caption { text-align: left; padding: 14px; color: #aebbb5; }
    th, td { border-bottom: 1px solid #28332c; padding: 9px 12px; text-align: center; }
    thead th { position: sticky; top: 0; z-index: 2; background: #202a24; min-width: 104px; max-width: 140px; vertical-align: bottom; }
    th:first-child { position: sticky; left: 0; min-width: 235px; max-width: 235px; text-align: left; background: #18211c; z-index: 1; border-right: 1px solid #3b4a40; }
    thead th:first-child { z-index: 3; background: #202a24; }
    tbody tr:hover td, tbody tr:hover th { background: #26352c; }
    .description { display: block; color: #9eafa4; font-weight: 400; font-size: 11px; margin-top: 4px; }
    .group-heading { color: #b8c7bf; background: #26352c; text-align: left; font-size: 12px; }
    .platform-group-start { border-left: 2px solid #63736a; }
    .entity-label { cursor: help; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .mark { display: inline-block; font-size: 20px; font-weight: 700; line-height: 1; padding: 2px 6px; cursor: help; }
    #tooltip { position: fixed; z-index: 5; max-width: min(390px, calc(100vw - 24px)); max-height: 50vh; overflow: auto; padding: 12px 15px; background: #303e35; border: 1px solid #789482; border-radius: 8px; box-shadow: 0 6px 25px #0008; font-size: 13px; line-height: 1.5; white-space: pre-line; }
    #tooltip a { color: #a8e4ff; text-decoration: underline; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) { body { padding: 16px; } th:first-child { min-width: 175px; max-width: 175px; } }
    body { padding: 20px; }
    .page-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); }
    .file-controls { margin: 0 0 0 auto; gap: 6px; }
    .file-controls button { padding: 5px 8px; font-size: 11px; color: #b8c7bf; }
    .controls { gap: 12px; margin-bottom: 14px; }
    .control-group { padding: 8px 10px 10px; flex-basis: 430px; }
    .control-group legend { font-size: 12px; }
    .control-fields { gap: 10px; }
    .control-fields label { flex: 1 1 140px; font-size: 11px; gap: 4px; }
    .control-fields input[type="search"], .control-fields select { width: 100%; max-width: 100%; min-width: 0; padding: 7px 8px; font-size: 12px; }
    .legend { gap: 16px; font-size: 12px; }
    #message { font-size: 12px; min-height: 0; margin: 10px 0; }
    #message:empty { display: none; }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Music distribution platforms</h1>
    <div class="file-controls">
      <button id="open-file" type="button">Load local file</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
      <button id="use-online" type="button" hidden>Use online data</button>
    </div>
  </header>
  <div class="controls">
    <fieldset class="control-group">
      <legend>Distributors</legend>
      <div class="control-fields">
        <label>Find distributor<input id="search" type="search" placeholder="Name or alias"></label>
        <label>Distributor group<select id="distributor-group"><option value="">All distributors</option></select></label>
        <label>Distributor order<select id="distributor-order"><option value="catalog">Catalog order</option><option value="name">Alphabetical</option><option value="yes" title="Count confirmed entries in the filtered table">Most confirmed (yes)</option><option value="group">Grouped</option></select></label>
      </div>
    </fieldset>
    <fieldset class="control-group">
      <legend>Platforms</legend>
      <div class="control-fields">
        <label>Find platform<input id="platform-search" type="search" placeholder="Name or alias"></label>
        <label>Platform group<select id="group"><option value="">All platforms</option></select></label>
        <label>Platform visibility<select id="platform-visibility"><option value="active">Active only</option><option value="all">Include inactive</option></select></label>
        <label>Platform order<select id="platform-order"><option value="catalog">Catalog order</option><option value="name">Alphabetical</option><option value="yes" title="Count confirmed entries in the filtered table">Most confirmed (yes)</option><option value="group">Grouped</option></select></label>
      </div>
    </fieldset>
  </div>
  <div class="legend"><span><b class="yes">✓</b> Supported</span><span><b class="no">✕</b> Unsupported</span><span><b class="never">∅</b> Never supported</span><span><b class="maybe">?</b> Maybe</span><span><b class="ended">■</b> Ended</span><span><b class="paused">Ⅱ</b> Paused</span><span><b class="unknown">~</b> Unknown</span></div>
  <p id="message" role="status" aria-live="polite"></p>
  <div class="table-wrap" tabindex="0" aria-label="Scrollable distributor comparison">
    <table id="table"></table>
  </div>
  <div id="tooltip" role="dialog" aria-label="Notes and sources" tabindex="0" hidden></div>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    let data = null;
    let selectedFile = null;
    let loadVersion = 0;
    const datasetUrl = 'https://raw.githubusercontent.com/djkhjg/music-distributor-to-platform-map/main/distributor-platforms.json';
    const symbols = { yes: '✓', no: '✕', never: '∅', maybe: '?', ended: '■', paused: 'Ⅱ', unknown: '~' };
    const strings = value => Array.isArray(value) ? value.filter(item => typeof item === 'string') : [];
    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }
    function nameLink(record) {
      const node = element('span', record.name);
      try {
        const url = new URL(record.url);
        if (!['http:', 'https:'].includes(url.protocol)) return node;
        const link = element('a', record.name);
        link.href = url.href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        return link;
      } catch { return node; }
    }
    function sourceDetails(url) {
      const metadata = data.sourceMetadata?.[url];
      const details = [url];
      if (metadata) {
        const dateLabels = { published: 'Published', updated: 'Updated', displayed: 'Page date', estimated: 'Estimated evidence date' };
        details.push(metadata.date ? `${dateLabels[metadata.dateType] || 'Evidence date'}: ${metadata.date}` : 'Evidence date: unknown');
        if (metadata.checked) details.push(`Source date checked: ${metadata.checked}`);
        if (metadata.access && metadata.access !== 'available') details.push(`Page access: ${metadata.access}`);
        details.push(...strings(metadata.notes));
      }
      return details.join('\n');
    }
    function entityLabel(record) {
      const label = element('span', undefined, 'entity-label');
      label.tabIndex = 0;
      label.append(nameLink(record), element('span', record.description || '', 'description'));
      const details = [record.name, record.description, `Group: ${record.group || 'Other'}`, ...strings(record.notes)].filter(Boolean);
      if (record.source) details.push('Primary list:', sourceDetails(record.source));
      label.dataset.tooltip = details.join('\n');
      return label;
    }
    function populateGroups(controlId, records, allLabel) {
      const control = $(controlId);
      const previous = control.value;
      control.replaceChildren(new Option(allLabel, ''));
      for (const group of new Set(Object.values(records).map(record => record.group || 'Other'))) control.add(new Option(group, group));
      if ([...control.options].some(option => option.value === previous)) control.value = previous;
    }
    function matches(id, record, query) {
      return [id, record.name, ...strings(record.aliases)].some(name => name.toLowerCase().includes(query));
    }
    function ordered(entries, mode, counts = new Map()) {
      if (mode === 'yes') return entries.sort((a, b) => (counts.get(b[0]) || 0) - (counts.get(a[0]) || 0) || a[1].name.localeCompare(b[1].name));
      if (mode === 'name') return entries.sort((a, b) => a[1].name.localeCompare(b[1].name));
      if (mode === 'group') {
        const groups = [...new Set(entries.map(([, record]) => record.group || 'Other'))];
        return entries.sort((a, b) => groups.indexOf(a[1].group || 'Other') - groups.indexOf(b[1].group || 'Other') || a[1].name.localeCompare(b[1].name));
      }
      return entries;
    }
    function validate(candidate) {
      const object = value => value && typeof value === 'object' && !Array.isArray(value);
      if (!object(candidate) || candidate.schemaVersion !== 1 || !object(candidate.providers) || !object(candidate.distributors)) {
        throw new Error('Expected schemaVersion 1 with providers and distributors keyed by ID.');
      }
      for (const record of [...Object.values(candidate.providers), ...Object.values(candidate.distributors)]) {
        if (!object(record) || typeof record.name !== 'string') throw new Error('Each entry needs a name.');
      }
      return candidate;
    }
    function accept(text) {
      const next = validate(JSON.parse(text));
      data = next;
      populateGroups('group', data.providers, 'All platforms');
      populateGroups('distributor-group', data.distributors, 'All distributors');
      render();
    }
    function render() {
      if (!data) return;
      $('tooltip').hidden = true;
      const query = $('search').value.trim().toLowerCase();
      const platformQuery = $('platform-search').value.trim().toLowerCase();
      const providers = Object.entries(data.providers).filter(([id, p]) =>
        ($('platform-visibility').value === 'all' || p.active !== false) &&
        (!$('group').value || (p.group || 'Other') === $('group').value) && matches(id, p, platformQuery));
      const distributors = Object.entries(data.distributors).filter(([id, d]) =>
        (!$('distributor-group').value || (d.group || 'Other') === $('distributor-group').value) && matches(id, d, query));
      const providerCounts = new Map();
      const distributorCounts = new Map();
      for (const [distributorId, distributor] of distributors) {
        for (const [providerId] of providers) {
          if (distributor.providers?.[providerId]?.status !== 'yes') continue;
          providerCounts.set(providerId, (providerCounts.get(providerId) || 0) + 1);
          distributorCounts.set(distributorId, (distributorCounts.get(distributorId) || 0) + 1);
        }
      }
      ordered(providers, $('platform-order').value, providerCounts);
      ordered(distributors, $('distributor-order').value, distributorCounts);
      const head = element('thead');
      const header = element('tr');
      const corner = element('th', 'Distributor');
      corner.scope = 'col';
      header.append(corner);
      let previousPlatformGroup = null;
      for (const [, p] of providers) {
        const cell = element('th');
        cell.scope = 'col';
        if ($('platform-order').value === 'group' && p.group !== previousPlatformGroup) {
          cell.append(element('div', p.group || 'Other', 'group-heading'));
          cell.classList.add('platform-group-start');
        }
        previousPlatformGroup = p.group;
        cell.append(entityLabel(p));
        header.append(cell);
      }
      head.append(header);
      const body = element('tbody');
      let previousDistributorGroup = null;
      for (const [, d] of distributors) {
        if ($('distributor-order').value === 'group' && d.group !== previousDistributorGroup) {
          const groupRow = element('tr');
          const groupCell = element('td', d.group || 'Other', 'group-heading');
          groupCell.colSpan = providers.length + 1;
          groupRow.append(groupCell);
          body.append(groupRow);
        }
        previousDistributorGroup = d.group;
        const row = element('tr');
        const label = element('th');
        label.scope = 'row';
        label.append(entityLabel(d));
        row.append(label);
        for (const [id, p] of providers) {
          const entry = d.providers?.[id];
          const status = Object.hasOwn(symbols, entry?.status) ? entry.status : 'unknown';
          const mark = element('span', symbols[status], `mark ${status}`);
          mark.tabIndex = 0;
          mark.setAttribute('aria-label', `${d.name} → ${p.name}: ${status}`);
          const details = [`${d.name} → ${p.name}`, `Status: ${status}`, ...strings(entry?.notes)];
          if (status === 'ended') details.push(`Delivery ended: ${entry.endedAt || 'date unknown'}`);
          if (status === 'paused') details.push(`Delivery paused: ${entry.pausedAt || 'date unknown'}`);
          if (!entry) details.push('No compatibility evidence recorded yet.');
          if (entry) details.push(entry.verified ? `Relationship reviewed: ${entry.verified}` : 'Relationship review date: unknown');
          const sources = strings(entry?.sources);
          if (sources.length) details.push('Sources:', ...sources.map(sourceDetails));
          mark.dataset.tooltip = details.join('\n');
          const cell = element('td');
          cell.append(mark);
          row.append(cell);
        }
        body.append(row);
      }
      $('table').replaceChildren(head, body);
      $('message').textContent = `${distributors.length} distributors · ${providers.length} platforms${distributors.length ? '' : ' · No distributors match'}${providers.length ? '' : ' · No platforms match'}`;
    }
    async function load() {
      const version = ++loadVersion;
      $('message').textContent = 'Loading…';
      try {
        let text;
        if (selectedFile) {
          text = await selectedFile.text();
        } else {
          const response = await fetch(datasetUrl, { cache: 'no-store' });
          if (!response.ok) throw new Error('Could not load online data (' + response.status + ').');
          text = await response.text();
        }
        if (version !== loadVersion) return;
        accept(text);
      } catch (error) {
        if (version !== loadVersion) return;
        $('message').textContent = error.message + ' Try refreshing or load a local file.' + (data ? ' Previous data remains displayed.' : '');
      }
    }
    $('open-file').addEventListener('click', () => { $('file').value = ''; $('file').click(); });
    $('file').addEventListener('change', () => {
      const file = $('file').files[0];
      if (!file) return;
      selectedFile = file;
      $('use-online').hidden = false;
      load();
    });
    $('use-online').addEventListener('click', () => {
      selectedFile = null;
      $('file').value = '';
      $('use-online').hidden = true;
      load();
    });
    $('search').addEventListener('input', render);
    $('platform-search').addEventListener('input', render);
    for (const id of ['group', 'distributor-group', 'platform-order', 'distributor-order', 'platform-visibility']) $(id).addEventListener('change', render);
    let tooltipTimeout;
    let tooltipTarget;
    function renderTooltip(text) {
      const tooltip = $('tooltip');
      tooltip.replaceChildren();
      for (const line of text.split('\n')) {
        const row = element('div');
        let url;
        try { url = new URL(line); } catch { /* Ordinary note text. */ }
        if (/^https?:\/\/\S+$/.test(line) && url && ['https:', 'http:'].includes(url.protocol)) {
          const link = element('a', line);
          link.href = url.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          row.append(link);
        } else {
          row.textContent = line;
        }
        tooltip.append(row);
      }
    }
    function showTooltip(event) {
      const target = event.target.closest('[data-tooltip]');
      if (!target) return;
      clearTimeout(tooltipTimeout);
      tooltipTarget?.removeAttribute('aria-describedby');
      tooltipTarget = target;
      const tooltip = $('tooltip');
      renderTooltip(target.dataset.tooltip);
      tooltip.hidden = false;
      tooltip.scrollTop = 0;
      target.setAttribute('aria-describedby', 'tooltip');
      const rect = target.getBoundingClientRect();
      tooltip.style.left = `${Math.max(12, Math.min(rect.left, innerWidth - tooltip.offsetWidth - 12))}px`;
      tooltip.style.top = `${Math.max(12, Math.min(rect.bottom + 8, innerHeight - tooltip.offsetHeight - 12))}px`;
    }
    function hideTooltip(event) {
      clearTimeout(tooltipTimeout);
      $('tooltip').hidden = true;
      tooltipTarget?.removeAttribute('aria-describedby');
      tooltipTarget = null;
    }
    function queueHideTooltip() { clearTimeout(tooltipTimeout); tooltipTimeout = setTimeout(hideTooltip, 180); }
    $('table').addEventListener('mouseover', showTooltip);
    $('table').addEventListener('focusin', showTooltip);
    $('table').addEventListener('mouseout', queueHideTooltip);
    $('table').addEventListener('focusout', queueHideTooltip);
    $('table').addEventListener('keydown', event => {
      if (event.key !== 'F2' || !event.target.closest('[data-tooltip]')) return;
      event.preventDefault();
      showTooltip(event);
      ($('tooltip').querySelector('a') || $('tooltip')).focus();
    });
    $('tooltip').addEventListener('mouseenter', () => clearTimeout(tooltipTimeout));
    $('tooltip').addEventListener('focusin', () => clearTimeout(tooltipTimeout));
    $('tooltip').addEventListener('mouseleave', queueHideTooltip);
    $('tooltip').addEventListener('focusout', queueHideTooltip);
    document.querySelector('.table-wrap').addEventListener('scroll', hideTooltip);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') hideTooltip(event); });
    window.addEventListener('resize', hideTooltip);
    load();
  </script>
</body>
</html>
